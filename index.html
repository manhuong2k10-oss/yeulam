<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gửi vk </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #f0fbf4; /* Nền xanh trắng nhẹ */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }
        
        /* Hình nền trái tim ở trung tâm */
        .heart-bg {
            position: absolute;
            width: 480px;
            height: 480px;
            background: rgba(46, 204, 113, 0.12); /* Tông xanh lá nhẹ */
            transform: rotate(-45deg);
            top: calc(50% - 240px);
            left: calc(50% - 240px);
            border-radius: 50% 50% 0 0;
            z-index: 1;
            pointer-events: none;
            box-shadow: 0 0 60px rgba(52, 152, 219, 0.15); /* Ánh xanh biển nhẹ */
        }
        .heart-bg::before {
            content: "";
            position: absolute;
            width: 480px;
            height: 480px;
            background: rgba(46, 204, 113, 0.12);
            border-radius: 50%;
            top: 0;
            left: 240px;
        }

        /* Khung container văn bản chạy chữ */
        .text-container {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 750px;
            min-height: 200px;
            background: rgba(255, 255, 255, 0.92);
            border-left: 6px solid #3498db; /* Viền xanh biển bên trái */
            border-right: 6px solid #2ecc71; /* Viền xanh lá bên phải */
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            text-align: center;
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .typing-text {
            font-size: 17px;
            line-height: 1.7;
            color: #2c3e50;
            font-weight: 500;
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: all 0.3s;
        }

        /* Khung đặc biệt làm nổi bật cho câu nói yêu thích cuối */
        .special-highlight {
            color: #1b7a43 !important;
            font-size: 19px !important;
            font-weight: 600 !important;
            background: rgba(46, 204, 113, 0.08);
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #2ecc71;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.1);
        }

        /* Nút xem toàn văn bản */
        .btn-view-all {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 20;
            padding: 12px 25px;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-view-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }

        /* Dòng ghi chú chỉ dẫn */
        .instruction {
            position: absolute;
            bottom: 35px;
            left: 30px;
            z-index: 20;
            color: #7f8c8d;
            font-size: 13px;
            background: rgba(255,255,255,0.75);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }

        /* Modal xem toàn bộ */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.4);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 800px;
            max-height: 85%;
            border-radius: 20px;
            padding: 30px;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }
        .modal-header {
            font-size: 20px;
            color: #2980b9;
            font-weight: bold;
            margin-bottom: 25px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn {
            cursor: pointer;
            font-size: 28px;
            color: #bdc3c7;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #e74c3c;
        }
        .all-text-body {
            font-size: 15px;
            line-height: 1.8;
            color: #34495e;
            white-space: pre-wrap;
            text-align: justify;
        }
        .all-text-body p {
            margin-bottom: 15px;
            padding: 4px 0;
        }
        .modal-highlight-box {
            color: #1b7a43;
            font-weight: bold;
            background: #f0fbf4;
            padding: 18px;
            border-radius: 12px;
            border-left: 5px solid #2ecc71;
            margin-top: 20px;
        }

        /* Tùy chỉnh scrollbar cho thanh lịch */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="heart-bg"></div>

    <div class="text-container" id="textContainer">
        <div class="typing-text" id="typingText">Nhấp chuột trái hoặc nhấn phím Cách (Space) để bắt đầu đọc tâm sự...</div>
    </div>

    <div class="instruction">Click chuột trái hoặc nút Space để sang dòng kế tiếp</div>

    <!-- Modal hiển thị đầy đủ văn bản -->

    </div>

 thắng thôi )", "Mik cũng nói mà cũng trả thua tối thì đầy hôm khuyê bọn mik vẫn ra đó thôi", "Mik cuunxg nói thì mik ko được đi tối tthì bọn mik phải chịu thôi chứu sao ạ", "có phải tui cũng nghxi theo lỗi thắng mà nhưng cậu ko nhứo thui", "-Cậu : K thắng cx đc", "Nhưng đây cậu ns hẳn thua", "Mik bực chứ s", "(vk à ....... ko thắng thì chỉ có thua thui có khác gì thau đâu nói thẳng ra chữu thua có sao đâu .... )", "vk nói ko được chứu thua chỗ nào vậy mik hỏi nhá ko được ó giống thua ko đioeeuf ko làm được nxg khác làm được vậy có phải thua ko", "cậu muốn mik nhắn nhưu này đúng khum ‘ Có ny yêu lâu v là k thua r , s cứ pk đi mới là thắng nhà nhắn tin còn hơn đi chs nhưng nhanh dứt’", "mik cũng nói ở đoạn này mà nhưng mik lạc quan khác thôi mà", "- Tui : thì thôi", "Thua thì thua dù sao sau trả thắng", "(mik có coi trọng thắng thau đầu vs sau mik khác rủ được thôi thì mik sẽ thắng thôi )", "Mik cũng nói mà cũng trả thua tối thì đầy hôm khuyê bọn mik vẫn ra đó thôi", "Mik cuunxg nói thì mik ko được đi tối tthì bọn mik phải chịu thôi chứu sao ạ", "h đến đoạn", "-Cậu: nói Cậu nghĩ cậu thua ,cậu k ngghix mik cx cảm thấy kém cạnh à", ",....", "Kém về khoản gđ", "mik phân tích cho cậu hiểu tại sao mik mới là nxg nghĩ vậy nhá", "Thứu 1 mik lè về phía gia đình để mà ba mẹ cậu ko tin tưởng ko cho cậu đi là do mik ko tốt vì sai vì thằng trường cũng là con trai giống mik đó nhưung rủ thì được nhưung mik thì ko đó alf vì tại sao vì bame cậu tin lso vậy lên mik ko được nhưu tehes suy ra là lỗi do mik", "thứu 2 việc mà để cho cậu ko đi còn là do mik ko bằng thằng dương dương lso tốt đưpjc bamej lso cho đi chs tối cùng còn mik thì ko lên ko cho lỗi là do mik", "thứ 3 gia dfdinfh cậu ko cho còn là do nxg rủ vậy yến rủ cũng được trhaay sao đến mik thì ko lên suy ra lỗi mik", "vậy cậu có gì mà thua mà cậu nói cậu thau có thua cũng là mik lên nghxi vậy", "còn cậu nói sao mik nghxi tốt cho nxg ta thì mik nói luôn là do mik nghĩ theo triều hướng mik vs bạn có thể so sách", "mik có ý gì là nói cậu thua kém ai bh đâu vs mik cậu luôn là nhất mà mik chỉ là ghen tị vs nxg ta ham muốn được nhưu ngx ta mik ham mik muốn mik khát khao được nhưu thế hiểu ko .... vs mik cậu luôn là nahats mà đâu phải cái thua nào cũng là nóiu kém cỏi hơn ngx ta đâu", "NGOAN KHÔNG NGHXI NHIỀU CẬU CHỈ CẦN BIẾT LÀ MIK YÊU CẬU ĐIỀU MIK MUỐN CHRI LÀ ĐƯỢC ĐI CHS VS CẬU VÀO BUỔI TỐI VÀ ĐƯỢC ÔM CẬU ĐƯỢC NÓI CHUEYENJ ĐÙA VS CẬU THÔI... BẢN THÂN BỌN MIK KO ĐƯỢC ZỊ LÊN MIK GHEN TỊ THUI MIK CHẤPNHẬN THÌ MIK NÓI ALF THUA THÔI ... VS MIK CẬU KO THUA NXG TA GÌ CẢ THUA Ở ĐÂY CHỈ LÀ NHỮUNG ĐIỀU BỌN MIK ĐƯỢC LÀM VỚI NHAU KHÔNG ĐƯỢC NHIỀU NHƯU NXG TA THUI NHƯNG MÀ >~< CÓ 1 THỨU NXG TA SẼ KO BH ĐƯỢC BẰNG BỌN MIK ... CÒN LÀ GÌ THFI KO NÓI NHƯUNG CÍA NÀY MIK NGHXI CẬU BIẾT Á"];
        const specialText = "NGOAN KHÔNG NGHXI NHIỀU CẬU CHỈ CẦN BIẾT LÀ MIK YÊU CẬU ĐIỀU MIK MUỐN CHRI LÀ ĐƯỢC ĐI CHS VS CẬU VÀO BUỔI TỐI VÀ ĐƯỢC ÔM CẬU ĐƯỢC NÓI CHUEYENJ ĐÙA VS CẬU THÔI... BẢN THÂN BỌN MIK KO ĐƯỢC ZỊ LÊN MIK GHEN TỊ THUI MIK CHẤPNHẬN THÌ MIK NÓI ALF THUA THÔI ... VS MIK CẬU KO THUA NXG TA GÌ CẢ THUA Ở ĐÂY CHỈ LÀ NHỮUNG ĐIỀU BỌN MIK ĐƯỢC LÀM VỚI NHAU KHÔNG ĐƯỢC NHIỀU NHƯU NXG TA THUI NHƯNG MÀ >~< CÓ 1 THỨU NXG TA SẼ KO BH ĐƯỢC BẰNG BỌN MIK ... CÒN LÀ GÌ THFI KO NÓI NHƯUNG CÍA NÀY MIK NGHXI CẬU BIẾT Á";

        let currentLineIndex = -1;
        let typingInterval = null;
        const typingSpeed = 35; // Tốc độ chạy chữ (mili giây/kí tự)

        const typingTextElem = document.getElementById('typingText');
        const viewAllBtn = document.getElementById('viewAllBtn');
        const textModal = document.getElementById('textModal');
        const closeBtn = document.getElementById('closeBtn');
        const allTextBody = document.getElementById('allTextBody');

        // Hàm hiệu ứng gõ chữ từng kí tự một
        function typeLine(text) {
            clearInterval(typingInterval);
            typingTextElem.innerHTML = '';
            
            // Nếu chạy đến đoạn text quan trọng cuối, áp dụng class đặc biệt
            if (text === specialText) {
                typingTextElem.classList.add('special-highlight');
            } else {
                typingTextElem.classList.remove('special-highlight');
            }

            let index = 0;
            typingInterval = setInterval(() => {
                if (index < text.length) {
                    typingTextElem.innerHTML += text.charAt(index);
                    index++;
                } else {
                    clearInterval(typingInterval);
                }
            }, typingSpeed);
        }

        // Chuyển sang câu/dòng tiếp theo
        function nextLine() {
            currentLineIndex++;
            if (currentLineIndex < textLines.length) {
                typeLine(textLines[currentLineIndex]);
            } else {
                currentLineIndex = 0; // Vòng lặp lại từ đầu
                typeLine(textLines[currentLineIndex]);
            }
        }

        // Bắt sự kiện click chuột trái toàn màn hình công cộng (trừ phần tử điều khiển)
        window.addEventListener('click', (e) => {
            if (e.target === viewAllBtn || textModal.contains(e.target) || closeBtn.contains(e.target)) return;
            nextLine();
        });

        // Bắt sự kiện ấn phím Space cách
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // chặn hành vi cuộn mặc định
                nextLine();
            }
        });

        // Đổ dữ liệu văn bản vào trong Modal Xem Toàn Bộ
        textLines.forEach(line => {
            const p = document.createElement('p');
            if (line === specialText) {
                const div = document.createElement('div');
                div.className = 'modal-highlight-box';
                div.textContent = line;
                allTextBody.appendChild(div);
            } else {
                p.textContent = line;
                allTextBody.appendChild(p);
            }
        });

        // Đóng mở Modal hiển thị
        viewAllBtn.addEventListener('click', () => {
            textModal.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            textModal.classList.remove('active');
        });

        textModal.addEventListener('click', (e) => {
            if (e.target === textModal) {
                textModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
